[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-crawler"
version = "1.0.0"
description = "Scrape a booking.com property page into a readable text report."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dominykas Meistas" }]
keywords = ["booking.com", "scraper", "reviews", "playwright"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "playwright>=1.44.0",
    "playwright-stealth>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/domeist/booking-crawler"
Repository = "https://github.com/domeist/booking-crawler"
Issues = "https://github.com/domeist/booking-crawler/issues"

[project.scripts]
booking-crawler = "booking_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["booking_crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
